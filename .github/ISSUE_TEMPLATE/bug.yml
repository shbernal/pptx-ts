# Three decisions here are load-bearing and were made against real filings, not taste:
#
# 1. A fidelity limit is a severity, not a separate form. It is neither a bug (the
#    OOXML is valid and the deck opens) nor a missing accessor, but every extra form
#    is more chooser than intake for a repo this size.
# 2. There is no browser or package-manager field. Every filing that had them
#    answered `n/a`. PowerPoint version is optional for the same reason: it is
#    meaningless for an API-shape report and load-bearing for a render one.
# 3. Who filed is a field, not a form. An `agent-report.yml` form once took filings
#    from agents, but the agents that file through the `pptx-ts-upstream` skill use
#    the API, which applies no form, and the API drops labels sent by anyone without
#    push access. So the form's label never reached those filings. The AI involvement
#    dropdown below discloses the same fact in the body, where every route keeps it.
name: Bug or fidelity limit
description: Wrong output, a thrown error, a repair prompt, a regression, wrong types, or a construct that does not survive a round trip.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. Before you start:

        - Confirm the problem still happens on the **latest release**.
        - pptx-ts is **ESM, Node-first**. CommonJS and IIFE/global browser bundles are not supported and reports about them will be closed.
        - If this is a security problem, **stop** and do not file it publicly. See [SECURITY.md](https://github.com/shbernal/pptx-ts/blob/main/SECURITY.md).
        - **Do not attach a deck containing real data.** Presentations carry client names, unreleased strategy, pricing and internal logos, and this tracker is public. Reduce the failure to a script that builds its own deck.
        - If a downstream consumer prompted this, describe the need **anonymously**: no consumer name, deck or client names, or file paths from its tree.

        Filing from an agent? The `pptx-ts-upstream` skill walks through all of this:
        `npx skills add shbernal/pptx-ts --skill pptx-ts-upstream`

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: |
        *Fidelity limit* means the package is valid and PowerPoint opens it, but something does not survive the trip.
      options:
        - Crash or repair prompt
        - Incorrect output
        - Fidelity limit
    validations:
      required: true

  - type: input
    id: error-class-and-code
    attributes:
      label: Error class and code
      description: >-
        `error.name` and `error.code`, if anything was thrown. The code is a stable
        `area/condition` string and is the fastest thing to search on.
      placeholder: InternalError / oxml/node-has-no-document
    validations:
      required: false

  - type: textarea
    id: observed
    attributes:
      label: What happens
      description: The actual behaviour, including any error text or the XML you found in the package.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should happen instead
      description: >-
        And why you believe that: a clause of ECMA-376, what PowerPoint itself does with
        the same input, or what the docs promise.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >-
        The smallest script that builds its own deck and shows the problem. Paste the code
        rather than attaching a project, and cut it down until removing anything more makes
        the failure disappear.
      render: javascript
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Error output
      description: Verbatim message, `error.detail`, and stack trace, if anything was thrown. Do not paraphrase.
      render: shell
    validations:
      required: false

  - type: input
    id: construct-key
    attributes:
      label: Construct key
      description: If the gap surfaces as a conversion fidelity note, its key, e.g. `table.rowAuto`. See [pptx-to-script](https://shbernal.github.io/pptx-ts/reference/pptx-to-script).
      placeholder: table.rowAuto
    validations:
      required: false

  - type: textarea
    id: cause-and-fixes
    attributes:
      label: Cause, and possible fixes
      description: If you traced it, say where it goes wrong and what the options are. A recommendation among them is welcome, since it is the most useful thing an issue can carry.
    validations:
      required: false

  - type: input
    id: version-pptx-ts
    attributes:
      label: pptx-ts version
      description: 'Exact installed version: `node -p "require(''pptx-ts/package.json'').version"`'
      placeholder: 4.1.0
    validations:
      required: true

  - type: input
    id: version-node
    attributes:
      label: Node.js version
      description: The package requires Node.js `>=24`.
      placeholder: v24.5.0
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Operating system
      description: Path handling, filesystem case sensitivity, and line endings differ by platform. Leave blank if the report cannot depend on them.
      placeholder: Windows 11 x64 / macOS 15 arm64 / Ubuntu 24.04 x64
    validations:
      required: false

  - type: input
    id: version-powerpoint
    attributes:
      label: PowerPoint version
      description: Only needed if the report depends on how PowerPoint renders or repairs the file. Leave blank otherwise.
      placeholder: Microsoft 365, Version 2406 (Windows)
    validations:
      required: false

  - type: dropdown
    id: ai-involvement
    attributes:
      label: AI involvement
      description: A disclosure, not a filter. Every answer is welcome. See [CONTRIBUTING.md](https://github.com/shbernal/pptx-ts/blob/main/CONTRIBUTING.md#ai-disclosure).
      options:
        - None
        - AI-assisted, and a person reviewed this report
        - Filed by an AI agent
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: >-
            No confidential data appears in this report, and any attached file was
            synthesized or authored by hand with no real data in it.
          required: true
