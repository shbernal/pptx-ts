name: Setup
description: Install pnpm and Node, then the workspace's dependencies. Run after checkout.

inputs:
  node-version:
    description: A Node version to use in place of `.node-version`. For matrix legs only.
    required: false
    default: ''
  cache:
    description: Whether to restore and save the pnpm store cache.
    required: false
    default: 'true'
  registry-url:
    description: Passed through to actions/setup-node, for the publish job.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # No `version:` here: the action reads it from the `packageManager` field in
    # package.json. That field is the single source of truth on purpose: Renovate
    # updates it and cannot update a version transcribed into a workflow, so a pin
    # here would silently drift out of step with the pnpm that generated
    # pnpm-lock.yaml and break `--frozen-lockfile` across a lockfile-format change.
    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      with:
        run_install: false

    # `.node-version` is the one place the primary Node version is written, and
    # local version managers read the same file. setup-node treats an empty input
    # as unset, so exactly one of the two version inputs is in effect.
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.node-version' || '' }}
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        cache-dependency-path: pnpm-lock.yaml
        package-manager-cache: ${{ inputs.cache }}
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
